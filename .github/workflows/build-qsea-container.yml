name: Build QSEA container

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Container tag
        required: true
        default: "0.1.0"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: containers/qsea
          push: true
          tags: ghcr.io/chshangy/nf-medip-qsea:${{ github.event.inputs.tag }}

